<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <clipPath id="bgClip">
      <rect width="64" height="64" rx="12" ry="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bgClip)">
    <!-- Sky -->
    <rect width="64" height="64" fill="#6db8e8"/>
    <!-- Horizon glow -->
    <rect x="0" y="40" width="64" height="6" fill="#fff0d4" opacity="0.55"/>

    <!-- Sun (voxel cube) -->
    <rect x="48" y="6"  width="6" height="6" fill="#fff7c8"/>
    <rect x="46" y="8"  width="2" height="2" fill="#fff7c8"/>
    <rect x="54" y="8"  width="2" height="2" fill="#fff7c8"/>
    <rect x="48" y="4"  width="6" height="2" fill="#fff7c8"/>
    <rect x="48" y="12" width="6" height="2" fill="#fff7c8"/>

    <!-- Cloud -->
    <rect x="4"  y="10" width="14" height="3" fill="#ffffff"/>
    <rect x="7"  y="7"  width="8"  height="3" fill="#ffffff"/>

    <!-- Grass (foreground) -->
    <rect x="0"  y="46" width="64" height="18" fill="#4ea83a"/>
    <rect x="0"  y="46" width="64" height="2"  fill="#5fc045"/>

    <!-- Tall grass tufts on grass surface -->
    <rect x="2"  y="44" width="2" height="4" fill="#3d8a2b"/>
    <rect x="6"  y="44" width="2" height="3" fill="#5fc045"/>
    <rect x="56" y="44" width="2" height="4" fill="#3d8a2b"/>
    <rect x="60" y="44" width="2" height="3" fill="#5fc045"/>

    <!-- ===== Hamster (front view, centered) ===== -->
    <!-- Ears (outer brown) -->
    <rect x="13" y="16" width="8" height="8" fill="#a85d05"/>
    <rect x="43" y="16" width="8" height="8" fill="#a85d05"/>
    <!-- Ears (inner pink) -->
    <rect x="15" y="18" width="4" height="4" fill="#f49aa3"/>
    <rect x="45" y="18" width="4" height="4" fill="#f49aa3"/>

    <!-- Head shell (round-ish via stacked rects) -->
    <rect x="14" y="22" width="36" height="24" fill="#fbc676"/>
    <rect x="12" y="24" width="40" height="20" fill="#fbc676"/>
    <rect x="16" y="20" width="32" height="2"  fill="#fbc676"/>

    <!-- Snout / belly patch -->
    <rect x="20" y="34" width="24" height="10" fill="#fff3dd"/>

    <!-- Cheek blush -->
    <rect x="11" y="32" width="3" height="4" fill="#f49aa3"/>
    <rect x="50" y="32" width="3" height="4" fill="#f49aa3"/>

    <!-- Eyes -->
    <rect x="20" y="28" width="5" height="6" fill="#0e0e12"/>
    <rect x="39" y="28" width="5" height="6" fill="#0e0e12"/>
    <!-- Eye highlights -->
    <rect x="22" y="29" width="2" height="2" fill="#ffffff"/>
    <rect x="41" y="29" width="2" height="2" fill="#ffffff"/>

    <!-- Nose -->
    <rect x="30" y="36" width="4" height="3" fill="#7a3915"/>

    <!-- Mouth -->
    <rect x="28" y="40" width="2" height="2" fill="#5c3315"/>
    <rect x="34" y="40" width="2" height="2" fill="#5c3315"/>
    <rect x="30" y="42" width="4" height="1" fill="#5c3315"/>
  </g>
</svg>
